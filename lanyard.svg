<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="auto">
  <defs>
    <!-- Card Glass Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14182e" />
      <stop offset="60%" stop-color="#0c0e1c" />
      <stop offset="100%" stop-color="#191d36" />
    </linearGradient>

    <!-- Holographic Shine Gradient -->
    <linearGradient id="holo-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#ec4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Metal Clip Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Strap Pattern -->
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <clipPath id="badge-clip">
      <rect x="70" y="80" width="320" height="280" rx="16" />
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Lanyard Pendulum Physics Animation */
    @keyframes lanyardSwing {
      0%   { transform: rotate(11deg); }
      15%  { transform: rotate(-8deg); }
      30%  { transform: rotate(5.5deg); }
      45%  { transform: rotate(-3.5deg); }
      60%  { transform: rotate(2deg); }
      75%  { transform: rotate(-1deg); }
      88%  { transform: rotate(0.5deg); }
      95%  { transform: rotate(-0.3deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes gentleDrift {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(1deg); }
      75% { transform: rotate(-1deg); }
    }
    .swing-assembly {
      transform-origin: 230px 0px;
      animation: lanyardSwing 3.6s cubic-bezier(0.25, 1, 0.5, 1) 1, gentleDrift 6s ease-in-out infinite 3.6s;
    }

    /* Hologram Shine Sweep */
    @keyframes shineMove {
      0% { transform: translateX(-380px) translateY(-100px) rotate(25deg); }
      100% { transform: translateX(450px) translateY(100px) rotate(25deg); }
    }
    .shine-bar {
      animation: shineMove 4s ease-in-out infinite;
    }
  </style>

  <!-- Entire Swinging Assembly -->
  <g class="swing-assembly">
    <!-- Lanyard Strap (Extends above canvas) -->
    <path d="M 215 -30 L 215 48 L 245 48 L 245 -30 Z" fill="url(#strap-grad)" />
    <!-- Stitching details on strap -->
    <line x1="218" y1="-30" x2="218" y2="48" stroke="#ffffff" stroke-opacity="0.3" stroke-dasharray="3,3" stroke-width="1" />
    <line x1="242" y1="-30" x2="242" y2="48" stroke="#ffffff" stroke-opacity="0.3" stroke-dasharray="3,3" stroke-width="1" />

    <!-- Metal Swivel Clasp & Ring -->
    <rect x="220" y="46" width="20" height="12" rx="3" fill="url(#metal-grad)" />
    <circle cx="230" cy="65" r="12" fill="none" stroke="url(#metal-grad)" stroke-width="3.5" />
    <rect x="225" y="72" width="10" height="10" rx="2" fill="url(#metal-grad)" />

    <!-- Badge Card Outer Shadow/Glow -->
    <rect x="68" y="78" width="324" height="284" rx="17" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1" />

    <!-- Badge Card Base -->
    <rect x="70" y="80" width="320" height="280" rx="16" fill="url(#card-grad)" stroke="#2b3356" stroke-width="1.5" />

    <!-- Clipped Area for Shine & Internals -->
    <g clip-path="url(#badge-clip)">
      <!-- Diagonal Holographic Glare -->
      <g class="shine-bar">
        <rect x="0" y="0" width="180" height="500" fill="url(#holo-shine)" />
      </g>

      <!-- Badge Slot Hole (where clip attaches) -->
      <rect x="205" y="90" width="50" height="7" rx="3.5" fill="#080a14" stroke="#2a304e" stroke-width="1" />

      <!-- Top Header Row -->
      <g transform="translate(90, 118)">
        <text fill="#38bdf8" class="font-mono" font-size="10" font-weight="700" letter-spacing="1.5">
          GITHUB VERIFIED // PASS
        </text>
        <circle cx="260" cy="-3" r="3.5" fill="#10b981" />
      </g>

      <!-- Golden Smart Card Chip -->
      <g transform="translate(92, 136)">
        <rect width="36" height="28" rx="5" fill="#f59e0b" fill-opacity="0.8" stroke="#d97706" stroke-width="1" />
        <rect x="4" y="4" width="28" height="20" rx="3" fill="#fbbf24" fill-opacity="0.4" />
        <line x1="18" y1="4" x2="18" y2="24" stroke="#b45309" stroke-width="1" />
        <line x1="4" y1="14" x2="32" y2="14" stroke="#b45309" stroke-width="1" />
      </g>

      <!-- Avatar Ring & Visual Identity -->
      <g transform="translate(142, 136)">
        <!-- Glowing Ring -->
        <circle cx="24" cy="14" r="22" fill="#131936" stroke="#c084fc" stroke-width="1.8" />
        <circle cx="24" cy="14" r="18" fill="#1e264f" />
        <!-- Tech Icon / Avatar Silhouette -->
        <text x="24" y="20" fill="#38bdf8" font-size="18" text-anchor="middle" class="font-sans">👨‍💻</text>
      </g>

      <!-- Developer Info -->
      <g transform="translate(92, 194)">
        <text fill="#ffffff" class="font-sans" font-size="19" font-weight="800" letter-spacing="0.2">
          Shivam Namdev
        </text>
        <text y="20" fill="#c084fc" class="font-mono" font-size="11" font-weight="600">
          LEAD QA &amp; AGENTIC ARCHITECT
        </text>
        
        <text y="42" fill="#94a3b8" class="font-mono" font-size="9.5">
          EXP: ~7.5 YEARS • PUNE, IN
        </text>
        <text y="56" fill="#64748b" class="font-mono" font-size="9.5">
          SPECIALTY: AUTONOMOUS TESTING &amp; PLATFORM
        </text>
      </g>

      <!-- Barcode Row -->
      <g transform="translate(92, 280)">
        <!-- Barcode lines -->
        <rect x="0" y="0" width="3" height="32" fill="#e2e8f0" />
        <rect x="5" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="9" y="0" width="6" height="32" fill="#e2e8f0" />
        <rect x="18" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="22" y="0" width="4" height="32" fill="#e2e8f0" />
        <rect x="28" y="0" width="7" height="32" fill="#e2e8f0" />
        <rect x="38" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="42" y="0" width="5" height="32" fill="#e2e8f0" />
        <rect x="50" y="0" width="3" height="32" fill="#e2e8f0" />
        <rect x="56" y="0" width="6" height="32" fill="#e2e8f0" />
        <rect x="65" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="70" y="0" width="8" height="32" fill="#e2e8f0" />
        <rect x="81" y="0" width="3" height="32" fill="#e2e8f0" />
        <rect x="87" y="0" width="5" height="32" fill="#e2e8f0" />
        <rect x="95" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="100" y="0" width="7" height="32" fill="#e2e8f0" />
        <rect x="110" y="0" width="3" height="32" fill="#e2e8f0" />
        <rect x="115" y="0" width="4" height="32" fill="#e2e8f0" />
        <rect x="122" y="0" width="6" height="32" fill="#e2e8f0" />
        <rect x="131" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="135" y="0" width="5" height="32" fill="#e2e8f0" />
        <rect x="143" y="0" width="3" height="32" fill="#e2e8f0" />
        <rect x="148" y="0" width="8" height="32" fill="#e2e8f0" />
        <rect x="159" y="0" width="2" height="32" fill="#e2e8f0" />
        <rect x="164" y="0" width="6" height="32" fill="#e2e8f0" />
        <rect x="173" y="0" width="4" height="32" fill="#e2e8f0" />
        <rect x="180" y="0" width="2" height="32" fill="#e2e8f0" />
        
        <!-- Serial Tag -->
        <text x="276" y="20" fill="#94a3b8" class="font-mono" font-size="10.5" text-anchor="end" font-weight="600">
          SN-007-PASS
        </text>
        <text x="276" y="32" fill="#475569" class="font-mono" font-size="8.5" text-anchor="end">
          AUTHENTIC ENGINEER
        </text>
      </g>
    </g>
  </g>
</svg>
