<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="auto">
  <defs>
    <linearGradient id="orbit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e1a" />
      <stop offset="50%" stop-color="#12162a" />
      <stop offset="100%" stop-color="#090b14" />
    </linearGradient>

    <!-- Core Glow -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Orbit rotations */
    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-inner { transform-origin: 170px 190px; animation: rotateCW 18s linear infinite; }
    .orbit-mid   { transform-origin: 170px 190px; animation: rotateCCW 26s linear infinite; }
    .orbit-outer { transform-origin: 170px 190px; animation: rotateCW 36s linear infinite; }

    /* Pulse Core */
    @keyframes corePulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .pulsing-core { transform-origin: 170px 190px; animation: corePulse 3s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect width="680" height="380" rx="16" fill="url(#orbit-bg)" stroke="#222744" stroke-width="1.5" />

  <!-- Window Header -->
  <rect width="680" height="36" rx="16" fill="#080a14" />
  <line x1="0" y1="36" x2="680" y2="36" stroke="#1d223a" stroke-width="1" />
  
  <circle cx="20" cy="18" r="4" fill="#ef4444" fill-opacity="0.8" />
  <circle cx="34" cy="18" r="4" fill="#f59e0b" fill-opacity="0.8" />
  <circle cx="48" cy="18" r="4" fill="#10b981" fill-opacity="0.8" />
  
  <text x="70" y="22" fill="#94a3b8" class="font-mono" font-size="11" font-weight="600">
    SYSTEM CAPABILITIES // TECH ORBIT
  </text>
  <text x="660" y="22" fill="#38bdf8" class="font-mono" font-size="10" text-anchor="end">
    LIVE STATUS: NOMINAL
  </text>

  <!-- ================= LEFT: 3D TECH ORBIT ================= -->
  <g id="orbit-system">
    <!-- Center Ambient Glow -->
    <circle cx="170" cy="190" r="45" fill="#a855f7" fill-opacity="0.25" filter="url(#core-glow)" />

    <!-- Orbit Tracks (Elliptical) -->
    <!-- Outer Track -->
    <ellipse cx="170" cy="190" rx="130" ry="110" fill="none" stroke="#252c4c" stroke-width="1" stroke-dasharray="3,4" />
    <!-- Middle Track -->
    <ellipse cx="170" cy="190" rx="95" ry="80" fill="none" stroke="#2c355c" stroke-width="1" stroke-dasharray="2,3" />
    <!-- Inner Track -->
    <ellipse cx="170" cy="190" rx="60" ry="50" fill="none" stroke="#374374" stroke-width="1" />

    <!-- Central Core (Agentic Intelligence) -->
    <g class="pulsing-core">
      <circle cx="170" cy="190" r="28" fill="#1e183a" stroke="#c084fc" stroke-width="2" />
      <circle cx="170" cy="190" r="22" fill="#2d1f55" />
      <text x="170" y="195" fill="#e879f9" font-size="18" text-anchor="middle">⚡</text>
    </g>
    <text x="170" y="232" fill="#e2e8f0" class="font-mono" font-size="8.5" font-weight="700" text-anchor="middle">
      AGENTIC QA
    </text>

    <!-- Outer Orbit Satellites -->
    <g class="orbit-outer">
      <!-- Docker Node -->
      <g transform="translate(300, 190)">
        <circle cx="0" cy="0" r="14" fill="#0f1f38" stroke="#38bdf8" stroke-width="1.5" />
        <text x="0" y="4" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">Docker</text>
      </g>
      <!-- CI/CD Node -->
      <g transform="translate(40, 190)">
        <circle cx="0" cy="0" r="14" fill="#1b122e" stroke="#ec4899" stroke-width="1.5" />
        <text x="0" y="4" fill="#f472b6" font-size="8" font-weight="700" text-anchor="middle" class="font-mono">CI/CD</text>
      </g>
    </g>

    <!-- Middle Orbit Satellites -->
    <g class="orbit-mid">
      <!-- Playwright Node -->
      <g transform="translate(170, 110)">
        <circle cx="0" cy="0" r="15" fill="#10251d" stroke="#22c55e" stroke-width="1.5" />
        <text x="0" y="4" fill="#4ade80" font-size="7.5" font-weight="700" text-anchor="middle" class="font-mono">PW</text>
      </g>
      <!-- TypeScript Node -->
      <g transform="translate(170, 270)">
        <circle cx="0" cy="0" r="15" fill="#0d2138" stroke="#38bdf8" stroke-width="1.5" />
        <text x="0" y="4" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle" class="font-mono">TS</text>
      </g>
    </g>

    <!-- Inner Orbit Satellites -->
    <g class="orbit-inner">
      <!-- Python Node -->
      <g transform="translate(230, 190)">
        <circle cx="0" cy="0" r="14" fill="#122538" stroke="#38bdf8" stroke-width="1.5" />
        <text x="0" y="4" fill="#60a5fa" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">Py</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: CAPABILITY TILES ================= -->
  <g transform="translate(345, 54)">
    <!-- Section Title -->
    <text x="0" y="16" fill="#94a3b8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">
      TECHNICAL PILLARS
    </text>

    <!-- Pillar 1: Autonomous QA & Agentic Testing -->
    <g transform="translate(0, 30)">
      <rect width="310" height="64" rx="8" fill="#111628" stroke="#273256" stroke-width="1" />
      <circle cx="24" cy="32" r="12" fill="#2d1f55" />
      <text x="24" y="37" fill="#c084fc" font-size="13" text-anchor="middle">🤖</text>
      <text x="48" y="26" fill="#f8fafc" class="font-sans" font-size="12.5" font-weight="700">
        Autonomous QA &amp; Agents
      </text>
      <text x="48" y="46" fill="#94a3b8" class="font-mono" font-size="10">
        MyAITesterBlueprint • LLM Assertion Synthesizers
      </text>
    </g>

    <!-- Pillar 2: Platform & Test Automation -->
    <g transform="translate(0, 106)">
      <rect width="310" height="64" rx="8" fill="#111628" stroke="#273256" stroke-width="1" />
      <circle cx="24" cy="32" r="12" fill="#0f2b38" />
      <text x="24" y="37" fill="#38bdf8" font-size="13" text-anchor="middle">🚀</text>
      <text x="48" y="26" fill="#f8fafc" class="font-sans" font-size="12.5" font-weight="700">
        Enterprise Platform Engineering
      </text>
      <text x="48" y="46" fill="#94a3b8" class="font-mono" font-size="10">
        Playwright • Python • TypeScript • Docker • K8s
      </text>
    </g>

    <!-- Pillar 3: Education & Mentorship -->
    <g transform="translate(0, 182)">
      <rect width="310" height="64" rx="8" fill="#111628" stroke="#273256" stroke-width="1" />
      <circle cx="24" cy="32" r="12" fill="#2e1a2f" />
      <text x="24" y="37" fill="#f472b6" font-size="13" text-anchor="middle">📚</text>
      <text x="48" y="26" fill="#f8fafc" class="font-sans" font-size="12.5" font-weight="700">
        Technical Education
      </text>
      <text x="48" y="46" fill="#94a3b8" class="font-mono" font-size="10">
        learn-python-step-by-step • DevOps Career Mentorship
      </text>
    </g>

    <!-- Pillar 4: Delivery Metrics -->
    <g transform="translate(0, 258)">
      <rect width="310" height="48" rx="8" fill="#0d1120" stroke="#1f2844" stroke-width="1" />
      <text x="16" y="24" fill="#38bdf8" class="font-mono" font-size="14" font-weight="800">~7.5+</text>
      <text x="65" y="24" fill="#94a3b8" class="font-sans" font-size="11">Years Exp</text>
      
      <line x1="140" y1="12" x2="140" y2="36" stroke="#242d4a" stroke-width="1" />
      
      <text x="156" y="24" fill="#4ade80" class="font-mono" font-size="14" font-weight="800">100%</text>
      <text x="206" y="24" fill="#94a3b8" class="font-sans" font-size="11">Automation</text>
    </g>
  </g>
</svg>
